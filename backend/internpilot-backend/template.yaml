AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: InternPilot Backend

# ============================================================
# GLOBAL FUNCTION SETTINGS
# ============================================================

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # DYNAMODB USERS TABLE
  # ==========================================================

  UsersTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: InternPilotUsers
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH


  # ==========================================================
  # DYNAMODB JOBS TABLE
  #
  # Stores internships/jobs collected by InternPilot.
  #
  # job_id is the unique identifier for every job.
  # ==========================================================

  JobsTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: InternPilotJobs
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S

      KeySchema:
        - AttributeName: job_id
          KeyType: HASH


  # ==========================================================
  # S3 RESUME BUCKET
  #
  # S3 sends Object Created events to EventBridge.
  #
  # IMPORTANT:
  # No LambdaConfigurations here.
  # This prevents circular dependencies.
  # ==========================================================

  ResumeBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "internpilot-resumes-${AWS::AccountId}"

      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true


  # ==========================================================
  # USER FUNCTION
  #
  # POST /users
  # ==========================================================

  UserFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: user_api/
      Handler: app.lambda_handler

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

      Events:
        CreateUser:
          Type: Api

          Properties:
            Path: /users
            Method: post


  # ==========================================================
  # RESUME UPLOAD FUNCTION
  #
  # POST /resume/upload-url
  #
  # Generates a presigned URL.
  # Frontend uploads PDF directly to S3.
  # ==========================================================

  ResumeFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: resume_api/
      Handler: app.lambda_handler

      Environment:
        Variables:
          RESUME_BUCKET: !Ref ResumeBucket

      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ResumeBucket

      Events:
        UploadResume:
          Type: Api

          Properties:
            Path: /resume/upload-url
            Method: post


  # ==========================================================
  # RESUME PROCESSOR FUNCTION
  #
  # S3
  #   ↓
  # EventBridge
  #   ↓
  # ResumeProcessorFunction
  #   ↓
  # Groq
  #   ↓
  # DynamoDB Users
  # ==========================================================

  ResumeProcessorFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: resume_processor/
      Handler: app.lambda_handler

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          GROQ_SECRET_NAME: internpilot/groq-api-key

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable

        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:internpilot/job-api-key*"
        # S3 read access
        - S3ReadPolicy:
            BucketName: !Ref ResumeBucket

        # Secrets Manager access
        - Statement:
            - Effect: Allow

              Action:
                - secretsmanager:GetSecretValue

              Resource:
                - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:internpilot/groq-api-key*"


  # ==========================================================
  # EVENTBRIDGE RULE
  #
  # Detects new objects uploaded to ResumeBucket.
  #
  # Only objects inside:
  #
  # resumes/
  #
  # are processed.
  # ==========================================================

  ResumeUploadEventRule:
    Type: AWS::Events::Rule

    Properties:
      Description: >
        Trigger resume processor when a PDF is uploaded
        to the InternPilot resume bucket

      State: ENABLED

      EventPattern:
        source:
          - aws.s3

        detail-type:
          - Object Created

        detail:
          bucket:
            name:
              - !Ref ResumeBucket

          object:
            key:
              - prefix: resumes/

      Targets:
        - Arn: !GetAtt ResumeProcessorFunction.Arn
          Id: ResumeProcessorTarget


  # ==========================================================
  # ALLOW EVENTBRIDGE TO INVOKE RESUME PROCESSOR
  # ==========================================================

  ResumeProcessorEventBridgePermission:
    Type: AWS::Lambda::Permission

    Properties:
      FunctionName: !Ref ResumeProcessorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ResumeUploadEventRule.Arn


  # ==========================================================
  # JOB INGESTION FUNCTION
  #
  # Temporary test version.
  #
  # POST /jobs/ingest
  #
  # Inserts a sample job into DynamoDB.
  # ==========================================================

  JobIngestionFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: job_ingestion/
      Handler: app.lambda_handler

      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable

      Events:

        IngestJobs:
          Type: Api

          Properties:
            Path: /jobs/ingest
            Method: post


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # USER API
  # ==========================================================

  UserApi:
    Description: User API endpoint

    Value: !Sub
      - "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/users"
      - {}


  # ==========================================================
  # RESUME API
  # ==========================================================

  ResumeApi:
    Description: Resume Upload API endpoint

    Value: !Sub
      - "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/resume/upload-url"
      - {}


  # ==========================================================
  # DYNAMODB USERS TABLE
  # ==========================================================

  DynamoDBTable:
    Description: InternPilot Users DynamoDB Table

    Value: !Ref UsersTable


  # ==========================================================
  # DYNAMODB JOBS TABLE
  # ==========================================================

  JobsDynamoDBTable:
    Description: InternPilot Jobs DynamoDB Table

    Value: !Ref JobsTable


  # ==========================================================
  # S3 BUCKET
  # ==========================================================

  ResumeBucketName:
    Description: InternPilot Resume S3 Bucket

    Value: !Ref ResumeBucket


  # ==========================================================
  # RESUME PROCESSOR
  # ==========================================================

  ResumeProcessorFunctionName:
    Description: Resume Processor Lambda Function

    Value: !Ref ResumeProcessorFunction


  # ==========================================================
  # JOB INGESTION FUNCTION
  # ==========================================================

  JobIngestionFunctionName:
    Description: Job Ingestion Lambda Function

    Value: !Ref JobIngestionFunction