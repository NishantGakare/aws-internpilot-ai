AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: InternPilot Backend

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12

Resources:

  # ==========================
  # DynamoDB Table
  # ==========================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: InternPilotUsers
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S

      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  # ==========================
  # S3 Bucket
  # ==========================
  ResumeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "internpilot-resumes-${AWS::AccountId}"

  # ==========================
  # User Lambda
  # ==========================
  UserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: user_api/
      Handler: app.lambda_handler

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

      Events:
        CreateUser:
          Type: Api
          Properties:
            Path: /users
            Method: post

  # ==========================
  # Resume Upload Lambda
  # ==========================
  ResumeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: resume_api/
      Handler: app.lambda_handler

      Environment:
        Variables:
          RESUME_BUCKET: !Ref ResumeBucket

      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ResumeBucket

      Events:
        UploadResume:
          Type: Api
          Properties:
            Path: /resume/upload-url
            Method: post

    # ==========================
  # Resume Processor Lambda
  # ==========================
  ResumeProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: resume_processor/
      Handler: app.lambda_handler

      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          GEMINI_SECRET_NAME: internpilot/gemini-api-key

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      
        - S3ReadPolicy:
            BucketName: !Ref ResumeBucket

        - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:internpilot/gemini-api-key*"

    Events:
      ResumeUploaded:
        Type: S3
        Properties:
          Bucket: !Ref ResumeBucket
          Events: s3:ObjectCreated:*

Outputs:

  UserApi:
    Description: User API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/users"

  ResumeApi:
    Description: Resume Upload API
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/resume/upload-url"

  DynamoDBTable:
    Description: Users Table
    Value: !Ref UsersTable

  ResumeBucketName:
    Description: Resume Bucket
    Value: !Ref ResumeBucket